<section class="py-20 bg-gradient-to-br from-krem-50 to-white">
  <div class="container mx-auto px-4 md:px-8">

    <!-- Header -->
    <div class="text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-serif text-white mb-6">Galeri</h1>
      <p class="text-xl text-gray-300 max-w-3xl mx-auto">
        Dokumentasi kegiatan kantor dan momen-momen penting dalam perjalanan pelayanan kami.
      </p>
    </div>

    <!-- Gallery Grid — diisi secara dinamis oleh script.js -->
    <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Foto akan di-render oleh JavaScript -->
    </div>

    <!-- Load More Button -->
    <div id="loadMoreWrapper" class="text-center mt-12">
      <button id="loadMoreBtn" onclick="loadMoreImages()"
        class="bg-navy-100 text-white px-8 py-3 rounded-full font-medium hover:bg-navy-200 transition duration-300">
        Muat Lebih Banyak
      </button>
    </div>

  </div>
</section>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden">
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="relative max-w-4xl w-full">

      <!-- Close Button -->
      <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white hover:text-gray-300 z-10">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <!-- Image -->
      <img id="lightboxImage" src="" alt=""
        class="w-full h-auto max-h-[80vh] object-contain rounded-lg" />

      <!-- Caption -->
      <div class="bg-white bg-opacity-90 p-4 rounded-b-lg">
        <h3 id="lightboxTitle" class="text-xl font-semibold text-gray-800 mb-2"></h3>
        <p id="lightboxDescription" class="text-gray-600"></p>
      </div>

      <!-- Navigation Arrows -->
      <button onclick="previousImage()"
        class="absolute left-4 top-1/2 transform -translate-y-1/2 text-white hover:text-gray-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button onclick="nextImage()"
        class="absolute right-4 top-1/2 transform -translate-y-1/2 text-white hover:text-gray-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>

    </div>
  </div>
</div>
